name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

# Use the same lock as the PR preview workflow: both mutate gh-pages.
concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.12

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          install: false

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build production site
        env:
          VITE_BASE_PATH: /axiom-synth/
        run: pnpm run build

      # Preserve only the preview tree. A blanket keep_files=true would also
      # retain obsolete hashed production assets indefinitely.
      - name: Checkout existing Pages content
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: existing-pages

      - name: Preserve active PR previews
        run: |
          if [ -d existing-pages/pr-preview ]; then
            cp -a existing-pages/pr-preview app/dist/pr-preview
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./app/dist
