name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/axiom-native/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/axiom-native/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Native Rust tests
        run: pnpm run test:native

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint && pnpm run lint:native
