name: PR Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

# Serialize every writer to gh-pages, including the production workflow.
concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        if: github.event.action != 'closed'
        uses: actions/checkout@v6

      - name: Setup pnpm and Node.js
        if: github.event.action != 'closed'
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          install: false

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Type-check
        if: github.event.action != 'closed'
        run: pnpm --filter @axiom/app exec vue-tsc -b

      - name: Build PR preview
        if: github.event.action != 'closed'
        run: pnpm --filter @axiom/app exec vite build --base="/axiom-synth/pr-preview/pr-${{ github.event.number }}/"

      - name: Deploy or remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./app/dist/
          preview-branch: gh-pages
          action: auto
          wait-for-pages-deployment: true
          comment: true
          qr-code: false
