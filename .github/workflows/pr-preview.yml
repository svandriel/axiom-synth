name: PR Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

# Serialize every writer to gh-pages, including the production workflow.
concurrency:
  group: github-pages-publish
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      # The removal action requires a checked-out Git repository. On close,
      # check out the base branch rather than the possibly unavailable PR merge ref.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.action == 'closed' && github.event.pull_request.base.ref || github.sha }}

      - name: Setup Emscripten
        if: github.event.action != 'closed'
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 6.0.12

      - name: Setup pnpm and Node.js
        if: github.event.action != 'closed'
        uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@24
          install: false

      - name: Install clang-format
        if: github.event.action != 'closed'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: github.event.action != 'closed'
        run: pnpm lint

      - name: Build
        if: github.event.action != 'closed'
        env:
          VITE_BASE_PATH: /axiom-synth/pr-preview/pr-${{ github.event.number }}/
        run: pnpm run build

      - name: Deploy or remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./app/dist/
          preview-branch: gh-pages
          action: auto
          wait-for-pages-deployment: true
          comment: true
          qr-code: false
