</div>
<div class="kb" id="kb">

<script>
  const $ = h => {

  function stepper(l, o) {

    const base = o.b ? H * 0.94 : H / 2;

          ).toFixed(1);

        h += `<path d="${d}L${W} ${base}L0 ${base}Z" fill="rgba(244,137,95,.2)"/><path d="${d}" stroke="#f4895f" stroke-width="6" opacity=".4" fill="none" style="filter:blur(3px)" vector-effect="non-scaling-stroke"/><path d="${d}" stroke="#ff9a72" stroke-width="2" fill="none" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
      else
        h += `<path d="${d}" stroke="${s.k == 'u' ? '#7f86ff' : '#8e9cbc'}" stroke-width="1.3" ${s.k == 'dry' ? 'stroke-dasharray="3 4"' : ''} fill="none" opacity=".65" vector-effect="non-scaling-stroke"/>`;

  const pl = () => $('<div class="pl"></div>');
  function mod(t, r, cls = '') {

      `<div class="mod ${cls}"><div class="mh"><h3>${t}</h3></div><div class="mb"></div></div>`,

  /* ---- waveforms ---- */
  const stops = [
      p => 2 * p - 1,
      p => (p < 0.75 ? -1 + 2 * Math.pow(p / 0.75, 2) : 1 - 8 * (p - 0.75)),

  const B = (v, p) => {
    const x = Math.min(v, 0.9999) * 4,
      i = Math.floor(x),
      f = x - i;
    return stops[i](p) * (1 - f) + stops[i + 1](p) * f;
  };

    const x = Math.min(v, 0.9999) * 4,
      i = Math.floor(x),
      f = x - i;

      ? SL[i]
      : f > 0.97
        ? SL[i + 1]
        : SL[i] + ' › ' + SL[i + 1] + ' ' + Math.round(f * 100) + '%';
  };
  const pc = v => Math.round(v * 100) + '%',
    bp = v => (v >= 0.5 ? '+' : '') + Math.round((v - 0.5) * 200) + '%';
  const EN = ['CLASSIC', 'SYNC', 'PD', 'SPEC'],
    EP = [
      [],
      [
        ['RATIO', v => (1 + 7 * v).toFixed(2) + '×'],
        ['AMOUNT', pc],
        ['SMOOTH', pc],
      ],
      [
        ['BEND', v => v.toFixed(2)],
        ['SKEW', bp],
        ['MIX', pc],
      ],
      [
        ['TILT', v => ((v - 0.5) * 24).toFixed(0) + ' dB'],
        ['SHIFT', v => 'H' + Math.round(1 + v * 15)],
        ['MIX', pc],
      ],
    ];
  function shape(o, m) {
    const v = o.wave,
      e = o.e[o.eng],
      y0 = B(v, m);
    if (o.eng == 1) return y0 + (B(v, (m * (1 + 7 * e[0])) % 1) - y0) * e[1];
    if (o.eng == 2) {
      const k = cl(e[0] + (e[1] - 0.5) * 0.3, 0.03, 0.97),
        p = m < k ? (0.5 * m) / k : 0.5 + (0.5 * (m - k)) / (1 - k);

    }

      const d = Math.abs(e[0] - 0.5) * 0.12 + 0.001;

      for (let j = -2; j <= 2; j++)
        a += B(v, (((m + (j * d) / 2) % 1) + 1) % 1);

      return y0 + ((e[0] < 0.5 ? a : y0 + (y0 - a) * 0.8) - y0) * e[2];
    }
    return y0;
  }
  /* ---- state ---- */
  const mk = (w, oct, eng, g, vo) => ({
    on: 1,
    wave: w,
    oct,
    semi: 0,
    det: 0.5,
    gain: g,
    voices: vo,
    ud: 0.4,
    dp: 0.55,
    bl: 0.6,
    eng,
    e: [[], [0.55, 0.72, 0.3], [0.22, 0.5, 0.8], [0.5, 0.4, 0.7]],
  });
  const S = {
    tab: 0,
    src: 3,
    keys: 1,
    osc: [
      mk(0.12, 0, 0, 0.8, 3),
      mk(0.62, -1, 1, 0.65, 1),
      mk(0.3, 1, 2, 0.5, 1),
    ],
  };
  const F = { type: 1, cut: 0.55, res: 0.4, env: 0.75, trk: 0.95 },
    SH = { type: 0, dist: 0.5, drive: 0.35 },
    EV = {
      sel: 0,
      a: [
        [0.1, 0.4, 0.6, 0.35],
        [0.05, 0.5, 0.3, 0.4],
      ],
    },
    LF = {
      sel: 0,
      l: [0, 1, 2, 3].map(i => ({ w: i % 4, rate: 0.35, dep: 0.6 })),
    };
  const FX = {
      ch: { on: 1, r: 0.3, d: 0.5, m: 0.4 },
      dl: { on: 1, t: 0.4, f: 0.35, m: 0.25 },
      rv: { on: 0, s: 0.5, dc: 0.5, m: 0.3 },
    },
    V = {
      mode: 0,
      poly: 8,
      glide: 0.15,
      bend: 2,
      tune: 0.5,
      arp: { on: 0, mode: 0, oct: 1, rate: 1, gate: 0.6, hold: 0 },
    };
  const SRC = [
      'LFO 1',
      'LFO 2',
      'LFO 3',
      'LFO 4',
      'ENV AMP',
      'ENV FILTER',
      'VELOCITY',
      'MOD WHEEL',
      'KEY TRACK',
    ],
    DST = [
      'VCO1 WAVE',
      'VCO2 WAVE',
      'VCO3 WAVE',
      'VCO1 PITCH',
      'VCO2 PITCH',
      'VCO3 PITCH',
      'CUTOFF',
      'RESONANCE',
      'SHAPER DRIVE',
      'AMP LEVEL',
      'DELAY MIX',
    ];
  const MX = [
    { s: 0, d: 0, a: 35 },
    { s: 5, d: 6, a: 50 },
    { s: 1, d: 8, a: -20 },
    { s: 7, d: 6, a: 40 },
    { s: 6, d: 9, a: 25 },
    { s: 2, d: 4, a: 0 },
  ];
  /* ---- WAVE slider ---- */
  const icon = i => {
    let d = '';
    for (let k = 0; k <= 32; k++) {

        (k ? 'L' : 'M') +
        (1 + p * 28).toFixed(1) +
        ' ' +
        (9 - y * 6.5).toFixed(1);

  };
  function wsl(o) {
    const r5 = [0, 1, 2, 3, 4],
      e = $(
        `<div class="ws" tabindex="0"><div class="wsh"><span>WAVE</span><b></b></div><div class="ic">${r5.map(icon).join('')}</div><div class="tk">${r5.map(i => `<u style="left:${i * 25}%"></u>`).join('')}<div class="fl"></div><div class="th"></div></div></div>`,

      const r = tk.getBoundingClientRect();

  /* ---- OSC tab ---- */

    (20 * Math.log10(Math.max(0.001, v / 0.8))).toFixed(1) + ' dB';
  function oscRow(n) {
    const o = S.osc[n],
      r = $(
        '<div class="row"><div class="id"></div><div class="disp"></div><div class="g sh"></div><div class="sep"></div><div class="g"><div class="sc2"></div></div><div class="sep"></div><div class="g un"></div></div>',
      );

      tog(

        v => (o.on = v),
      ),
      knob('GAIN', { g: () => o.gain, s: v => (o.gain = v), d: 0.8, f: gdb }),
    );

      knob('DETUNE', {

        g: () => o.det,

  }
  /* ---- build sections ---- */
  const main = document.getElementById('main'),
    secs = [];

    const s = $('<section class="sec panel"></section>');

  /* FILTER */
  const hz = v => 20 * Math.pow(1000, v),
    hzs = v => {
      const f = Math.round(hz(v));

    };
  const sF = sec(),
    fm = mod(
      'VCF',
      seg(
        ['LP12', 'LP24', 'HP12', 'HP24', 'BP', 'NOTCH'],

        v => (F.type = v),
      ),
    ),
    fk = $('<div class="ks w4"></div>'),
    fp = pl();
  fk.append(
    knob('CUTOFF', { g: () => F.cut, s: v => (F.cut = v), d: 0.55, f: hzs }),
    knob('RES', { g: () => F.res, s: v => (F.res = v), d: 0.3, f: pc }),
    knob('ENV AMT', {

      g: () => F.env,
      s: v => (F.env = v),

  const resp = x => {
    const r = hz(x) / hz(F.cut),
      n = [2, 4, 2, 4][F.type];

  };
  syncs.push(() => plot(fp, [{ k: 'main', f: resp }], { b: 1 }));
  const shm = mod(
      'SHAPER',
      seg(
        ['SOFT', 'ATAN', 'TUBE', 'CLIP', 'SINE', 'CHEB'],
        () => SH.type,
        v => (SH.type = v),
      ),
    ),
    sk = $('<div class="ks w4"></div>'),
    sp = pl();
  sk.append(
    knob('DISTORTION', {
      g: () => SH.dist,
      s: v => (SH.dist = v),
      d: 0.5,
      f: pc,
    }),
    knob('DRIVE', {
      g: () => SH.drive,
      s: v => (SH.drive = v),
      d: 0.35,
      f: v => (v * 24).toFixed(1) + ' dB',
    }),
  );
  shm.children[1].append(sk, sp);
  const xfer = x => {
    const u = cl((x * 2 - 1) * (1 + SH.drive * 2), -1, 1),
      k = 1 + SH.dist * 8,
      t = SH.type;
    return cl(
      [
        Math.tanh(k * u) / Math.tanh(k),
        Math.atan(k * u) / Math.atan(k),
        (Math.sign(u) * (1 - Math.exp(-k * Math.abs(u)))) / (1 - Math.exp(-k)),
        cl(k * u, -1, 1),
        Math.sin(((u * Math.PI) / 2) * (1 + SH.dist * 2)),
        u + SH.dist * (4 * u * u * u - 3 * u) * 0.6,
      ][t],
      -1,
      1,
    );
  };
  syncs.push(() =>
    plot(sp, [
      { k: 'dry', f: x => x * 2 - 1 },
      { k: 'main', f: xfer },
    ]),
  );
  sF.append(...[fm, shm]);
  sF.firstChild.style.marginBottom = '12px';
  /* MOD */
  const tm = s => {
    const ms = 2 + s * s * 4000;
    return ms >= 1000 ? (ms / 1000).toFixed(2) + ' s' : Math.round(ms) + ' ms';
  };
  const sM = sec(),
    em = mod(
      'ENVELOPE',
      seg(
        ['AMP', 'FILTER'],
        () => EV.sel,
        v => (EV.sel = v),
      ),
    ),
    ek2 = $('<div class="ks w2"></div>'),
    ep = pl();
  [
    ['ATTACK', 0, tm],
    ['DECAY', 1, tm],
    ['SUSTAIN', 2, pc],
    ['RELEASE', 3, tm],
  ].forEach(([n, i, f]) =>
    ek2.append(
      knob(n, {
        g: () => EV.a[EV.sel][i],
        s: v => (EV.a[EV.sel][i] = v),
        d: 0.5,
        f,
      }),
    ),
  );
  em.children[1].append(ek2, ep);
  syncs.push(() => {
    const [a, d, s, r] = EV.a[EV.sel].map((v, i) =>
        i == 2 ? v : 0.02 + v * v * 0.6,
      ),
      tot = a + d + 0.25 + r;
    plot(
      ep,
      [
        {
          k: 'main',
          f: x => {
            const t = x * tot;
            let y;
            if (t < a) y = t / a;
            else if (t < a + d) y = 1 - ((1 - s) * (t - a)) / d;
            else if (t < a + d + 0.25) y = s;
            else y = s * (1 - (t - a - d - 0.25) / r);
            return 2 * cl(y) - 1;
          },
        },
      ],
      { b: 1 },
    );
  });
  const lm = mod(
      'LFO',
      seg(
        ['LFO1', 'LFO2', 'LFO3', 'LFO4'],
        () => LF.sel,
        v => (LF.sel = v),
      ),
    ),
    lk = $('<div class="ks w2"></div>'),
    lp = pl(),
    L = () => LF.l[LF.sel];
  lk.append(
    knob('RATE', {
      g: () => L().rate,
      s: v => (L().rate = v),
      d: 0.35,
      f: v => (0.05 * Math.pow(400, v)).toFixed(2) + ' Hz',
    }),
    knob('DEPTH', { g: () => L().dep, s: v => (L().dep = v), d: 0.6, f: pc }),
  );
  const lw = seg(
    ['SIN', 'TRI', 'SQR', 'SAW'],
    () => L().w,
    v => (L().w = v),
  );
  lm.children[0].append(lw);
  lm.children[1].append(lk, lp);
  syncs.push(() =>
    plot(lp, [
      {
        k: 'main',
        f: x => {
          const p = (x * 3) % 1;
          return (
            L().dep *
            [
              Math.sin(2 * Math.PI * p),
              p < 0.5 ? 4 * p - 1 : 3 - 4 * p,
              p < 0.5 ? 1 : -1,
              2 * p - 1,
            ][L().w]
          );
        },
      },
    ]),
  );
  const mxm = mod('MOD MATRIX'),
    mb = mxm.children[1];
  mb.style.display = 'block';
  MX.forEach(r => {
    const e = $(
        `<div class="mr"><select>${SRC.map(x => `<option>${x}</option>`).join('')}</select><span>›</span><select>${DST.map(x => `<option>${x}</option>`).join('')}</select><input type="range" min="-100" max="100"><em></em></div>`,
      ),
      [a, , b, i, t] = e.children;
    a.selectedIndex = r.s;
    b.selectedIndex = r.d;
    i.value = r.a;
    a.onchange = () => {
      r.s = a.selectedIndex;
    };
    b.onchange = () => {
      r.d = b.selectedIndex;
    };
    i.oninput = () => {
      r.a = +i.value;
      sync();
    };
    i.ondblclick = () => {
      r.a = 0;
      i.value = 0;
      sync();
    };
    syncs.push(() => {
      t.textContent = (r.a > 0 ? '+' : '') + r.a + '%';
      e.classList.toggle('z', !r.a);
    });
    mb.append(e);
  });
  const tp = $('<div class="cols c2"></div>');
  tp.append(em, lm);
  sM.append(tp, mxm);
  mxm.style.marginTop = '12px';
  /* FX */
  const sX = sec(),
    cols = $('<div class="cols c3"></div>'),
    fxm = (t, k, ks, pf) => {
      const m = mod(
          t,
          tog(
            'ON',
            () => FX[k].on,
            v => (FX[k].on = v),
            'sm',
          ),
        ),
        kk = $('<div class="ks" style="justify-content:space-between"></div>'),
        p = pl();
      p.style.height = '215px';
      p.style.background = 'var(--dp)';
      p.style.borderRadius = '9px';
      p.style.border = '1px solid #2b3650';
      ks.forEach(([n, key, f]) =>
        kk.append(
          knob(n, { g: () => FX[k][key], s: v => (FX[k][key] = v), d: 0.4, f }),
        ),
      );
      m.children[1].style.cssText = 'display:block';
      m.children[1].append(kk, $('<div style="height:12px"></div>'), p);
      syncs.push(() => {
        plot(p, [{ k: 'main', f: pf }]);
        m.style.opacity = FX[k].on ? 1 : 0.55;
      });
      return m;
    };
  cols.append(
    fxm(
      'CHORUS',
      'ch',
      [
        ['RATE', 'r', v => (0.1 + v * 5).toFixed(1) + ' Hz'],
        ['DEPTH', 'd', pc],
        ['MIX', 'm', pc],
      ],
      x =>
        0.5 * Math.sin(2 * Math.PI * (x * 3 + 0)) +
        0.4 * Math.sin(2 * Math.PI * (x * 3 * (1 + FX.ch.d * 0.1) + 0.25)),
    ),
    fxm(
      'DELAY',
      'dl',
      [
        ['TIME', 't', v => Math.round(40 + v * 960) + ' ms'],
        ['FEEDBACK', 'f', pc],
        ['MIX', 'm', pc],
      ],
      x => {
        const s = x * 5,
          f = s % 1;
        return f < 0.07 ? 2 * Math.pow(FX.dl.f, Math.floor(s)) - 1 : -1;
      },
    ),
    fxm(
      'REVERB',
      'rv',
      [
        ['SIZE', 's', pc],
        ['DECAY', 'dc', v => (0.3 + v * 9).toFixed(1) + ' s'],
        ['MIX', 'm', pc],
      ],
      x =>
        Math.exp(-x * (7 - 5 * FX.rv.dc)) *
        Math.sin(x * 140 + Math.sin(x * 70)) *
        0.95,
    ),
  );
  const ch = $('<div class="chain"></div>');
  const CH = [
    ['VOICES', () => 1],
    ['SHAPER', () => SH.dist > 0],
    ['CHORUS', () => FX.ch.on],
    ['DELAY', () => FX.dl.on],
    ['REVERB', () => FX.rv.on],
    ['OUT', () => 1],
  ].map(([t, g], i) => {
    const s = $(`<span>${t}</span>`);
    ch.append(...(i ? [$('<b>→</b>'), s] : [s]));
    return [s, g];
  });
  syncs.push(() => CH.forEach(([s, g]) => s.classList.toggle('on', !!g())));
  sX.append(cols, ch);
  /* VOICE */
  const sV = sec(),
    pm = mod('PLAY'),
    pk = $('<div class="ks" style="gap:14px;align-items:flex-start"></div>');
  pm.children[1].style.cssText = 'display:block';
  const pr = $('<div style="margin-bottom:16px"></div>');
  pr.append(
    seg(
      ['POLY', 'MONO', 'LEGATO'],
      () => V.mode,
      v => (V.mode = v),
    ),
  );
  pk.append(
    stepper('VOICES', {
      g: () => V.poly,
      s: v => (V.poly = v),
      min: 1,
      max: 8,
      d: 8,
    }),
    knob('GLIDE', {
      g: () => V.glide,
      s: v => (V.glide = v),
      d: 0,
      f: v => (v ? Math.round(v * v * 2000) + ' ms' : 'OFF'),
    }),
    stepper('BEND RANGE', {
      g: () => V.bend,
      s: v => (V.bend = v),
      min: 1,
      max: 12,
      d: 2,
      f: v => '±' + v + ' st',
    }),
    knob('MASTER TUNE', {
      bi: 1,
      g: () => V.tune,
      s: v => (V.tune = v),
      d: 0.5,
      f: v => ((v - 0.5) * 100).toFixed(0) + ' ct',
    }),
  );
  const vd = $('<div class="vd" style="margin-top:20px"></div>');
  for (let i = 0; i < 8; i++) vd.append($('<i></i>'));
  syncs.push(() =>
    [...vd.children].forEach((c, i) =>
      c.classList.toggle('on', i < (V.mode ? 1 : Math.min(V.poly, 5))),
    ),
  );
  pm.children[1].append(
    pr,
    pk,
    $('<div class="hint" style="margin-top:22px">VOICE ALLOCATION</div>'),
    vd,
  );
  const A = V.arp,
    am = mod(
      'ARPEGGIATOR',
      tog(
        'ON',
        () => A.on,
        v => (A.on = v),
        'sm',
      ),
    ),
    ak = $(
      '<div class="ks" style="gap:14px;align-items:flex-start;margin-top:16px"></div>',
    );
  am.children[1].style.cssText = 'display:block';
  ak.append(
    stepper('OCTAVES', {
      g: () => A.oct,
      s: v => (A.oct = v),
      min: 1,
      max: 4,
      d: 1,
    }),
    knob('GATE', { g: () => A.gate, s: v => (A.gate = v), d: 0.6, f: pc }),
    tog(
      'HOLD',
      () => A.hold,
      v => (A.hold = v),
      'sm',
    ),
  );
  const rt = $('<div style="margin-top:16px"></div>');
  rt.append(
    seg(
      ['1/4', '1/8', '1/16', '1/32'],
      () => A.rate,
      v => (A.rate = v),
    ),
  );
  am.children[1].append(
    seg(
      ['UP', 'DOWN', 'UP/DN', 'RANDOM'],
      () => A.mode,
      v => (A.mode = v),
    ),
    rt,
    ak,
  );
  syncs.push(() => (am.style.opacity = A.on ? 1 : 0.6));
  const vc = $('<div class="cols c2"></div>');
  vc.append(pm, am);
  sV.append(vc);
  /* ---- tabs ---- */
  const TB = [
      ['OSC', '3 × ENGINE'],
      ['FILTER', 'VCF · SHAPER'],
      ['MOD', 'ENV · LFO · MATRIX'],
      ['FX', 'CHORUS · DELAY · REVERB'],
      ['VOICE', 'POLY · GLIDE · ARP'],
    ],
    tabs = document.getElementById('tabs');
  const bds = [
    () => '',
    () => '',
    () => MX.filter(r => r.a).length || '',
    () => Object.values(FX).filter(f => f.on).length || '',
    () => (A.on ? 'ARP' : ''),
  ];
  const tel = TB.map(([a, b], i) => {
    const e = $(
      `<div class="tab">${a}<small>${b}</small><em class="bd"></em></div>`,
    );
    e.onclick = () => {
      S.tab = i;
      sync();
      fit();
    };
    tabs.append(e);
    return e;
  });
  syncs.push(() => {
    tel.forEach((e, i) => {
      e.classList.toggle('on', i == S.tab);
      e.querySelector('.bd').textContent = bds[i]();
    });
    secs.forEach((s, i) => s.classList.toggle('on', i == S.tab));
  });
  /* ---- scope + output ---- */
  const oy = (o, t) =>
      o.on
        ? shape(o, (t * 3 * Math.pow(2, o.oct + o.semi / 12)) % 1) * o.gain
        : 0,
    mixf = t => S.osc.reduce((a, o) => a + oy(o, t), 0) / 2.2;
  const scopeF = x => {
    const t = x * 2;
    if (S.src < 3) return cl(oy(S.osc[S.src], t) * 1.1, -1, 1);
    if (S.src == 3) return cl(mixf(t), -1, 1);
    const w = (1 - F.cut) * 0.05 + 0.0005;
    let a = 0;
    for (let j = -3; j <= 3; j++) a += mixf(t + (j * w) / 3);
    return Math.tanh((a / 7) * (1 + SH.drive * 3));
  };
  document.getElementById('src').append(
    seg(
      ['OSC1', 'OSC2', 'OSC3', 'MIX', 'OUT'],
      () => S.src,
      v => (S.src = v),
    ),
  );
  const scEl = document.getElementById('scope');
  syncs.push(() => plot(scEl, [{ k: 'main', f: scopeF }]));
  const mt = [0, 1].map(() =>
      $('<div class="meter"><i style="height:60%"></i></div>'),
    ),
    cpuB = $('<b>0%</b>');
  const out = document.getElementById('out');
  out.append(
    ...mt,
    knob('MASTER', {
      g: () => S.m ?? 0.72,
      s: v => (S.m = v),
      d: 0.72,
      f: v => (20 * Math.log10(Math.max(v, 0.001) / 0.8)).toFixed(1) + ' dB',
    }),
  );
  const st = $(
    '<div class="stat"><div>VOICES<b>5 / 8</b></div><div>CPU </div><div>OCTAVE<b>C3</b></div></div>',
  );
  st.children[1].append(cpuB);
  out.append(st);
  syncs.push(() => {
    const c = Math.round(
      6 +
        S.osc.reduce(
          (a, o) => a + (o.on ? o.voices * [1, 1.6, 1.8, 7][o.eng] : 0),
          0,
        ) *
          1.4,
    );
    cpuB.textContent = c + '%';
    cpuB.classList.toggle('hot', c > 70);
  });
  setInterval(
    () =>
      mt.forEach(
        m => (m.firstChild.style.height = 48 + Math.random() * 30 + '%'),
      ),
    140,
  );
  /* ---- keyboard ---- */
  const wl = 'ZXCVBNMQWERTYUI',
    nm = 'CDEFGAB',
    bkL = ['S', 'D', 'G', 'H', 'J', '2', '3', '5', '6', '7'],
    bpos = [0, 1, 3, 4, 5, 7, 8, 10, 11, 12],
    kmap = {},
    ww = 100 / 15,
    keys = document.getElementById('keys');
  for (let i = 0; i < 15; i++) {
    const e = $(
      `<div class="w" style="left:${i * ww}%;width:${ww}%"><u>${nm[i % 7]}</u><span>${wl[i]}</span></div>`,
    );
    kmap[wl[i]] = e;
    keys.append(e);
  }
  bpos.forEach((p, j) => {
    const e = $(
      `<div class="bk" style="left:${(p + 1) * ww - ww * 0.3}%;width:${ww * 0.6}%"><span>${bkL[j]}</span></div>`,
    );
    kmap[bkL[j]] = e;
    keys.append(e);
  });
  Object.values(kmap).forEach(e => {
    e.onpointerdown = () => e.classList.add('h');
    e.onpointerup = e.onpointerleave = () => e.classList.remove('h');
  });
  addEventListener('keydown', e => {
    const k = kmap[e.key.toUpperCase()];
    if (k && !e.repeat && e.target.tagName != 'SELECT') k.classList.add('h');
  });
  addEventListener('keyup', e => {
    const k = kmap[e.key.toUpperCase()];
    if (k) k.classList.remove('h');
  });
  function wheel(l, spring) {
    const e = $(
        `<div class="wh"><div class="wt"><i></i></div><span>${l}</span></div>`,
      ),
      t = e.firstChild,
      i = t.firstChild;
    let v = spring ? 0.5 : 0,
      dn = 0;
    const draw = () =>
        (i.style.top = `calc(${(1 - v) * 100}% - ${(1 - v) * 14}px)`),
      at = ev => {
        const r = t.getBoundingClientRect();
        v = cl(1 - (ev.clientY - r.top) / r.height);
        draw();
      };
    t.onpointerdown = ev => {
      dn = 1;
      t.setPointerCapture(ev.pointerId);
      at(ev);
    };
    t.onpointermove = ev => {
      if (dn) at(ev);
    };
    t.onpointerup = () => {
      dn = 0;
      if (spring) {
        v = 0.5;
        draw();
      }
    };
    draw();
    return e;
  }
  document.getElementById('wls').append(wheel('PITCH', 1), wheel('MOD', 0));
  const kb = document.getElementById('kb'),
    kt = tog(
      'KEYBOARD',
      () => S.keys,
      v => {
        S.keys = v;
        kb.classList.toggle('min', !v);
        setTimeout(fit, 0);
      },
      'sm',
    );
  document.getElementById('kt').append(kt);
  /* ---- fit to viewport ---- */
  function fit() {
    const b = document.body;
    b.style.zoom = 1;
    b.style.zoom = Math.max(
      0.5,
      Math.min(1, innerWidth / 1330, innerHeight / (b.scrollHeight + 8)),
    );
  }
  addEventListener('resize', fit);
  sync();
  fit();
</script>
