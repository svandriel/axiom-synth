<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OSC 1 — Neumorphic Button</title>
    <style>
      :root {
        --bg: #f0f1f4;
        --surface: #f3f4f7;
        --text: #4a5568;
        --led: #4f6ef7;
        --shadow-dark: rgba(163, 177, 198, 0.5);
        --shadow-light: rgba(255, 255, 255, 0.9);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: var(--bg);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial,
          sans-serif;
      }

      .osc-button {
        position: relative;
        width: 280px;
        height: 280px;
        border: none;
        border-radius: 56px;
        background: var(--surface);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0;
        color: var(--text);
        font: inherit;

        box-shadow:
          20px 20px 44px var(--shadow-dark),
          -20px -20px 44px var(--shadow-light);

        transition:
          box-shadow 0.18s ease,
          transform 0.18s ease;
      }

      .osc-button:hover {
        box-shadow:
          22px 22px 48px var(--shadow-dark),
          -22px -22px 48px var(--shadow-light);
      }

      .osc-button:active,
      .osc-button.is-active {
        box-shadow:
          inset 10px 10px 20px var(--shadow-dark),
          inset -10px -10px 20px var(--shadow-light);
        transform: translateY(1px);
      }

      .osc-button:focus-visible {
        outline: 3px solid var(--led);
        outline-offset: 4px;
      }

      .led {
        position: absolute;
        top: 46px;
        right: 50px;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 32% 28%,
          #ffffff,
          #7b93ff 35%,
          var(--led) 65%,
          #2f47c9 100%
        );
        box-shadow:
          0 0 8px 2px rgba(79, 110, 247, 0.65),
          0 0 14px 5px rgba(79, 110, 247, 0.3),
          1px 1px 2px rgba(163, 177, 198, 0.7);
      }

      .wave-wrap {
        position: relative;
        width: 130px;
        height: 80px;
      }

      .wave {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .wave .line {
        fill: none;
        stroke-linecap: round;
        stroke: #8d98a8;
        stroke-width: 6.5;
        filter: drop-shadow(1.3px 1.6px 1px rgba(120, 132, 150, 0.55))
          drop-shadow(-1px -1.2px 1px rgba(255, 255, 255, 0.9));
      }

      .label {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.03em;
        color: #48505e;
        text-shadow:
          1px 1px 1px rgba(255, 255, 255, 0.85),
          -1px -1px 1px rgba(163, 177, 198, 0.35);
      }

      .underline {
        width: 96px;
        height: 4px;
        border-radius: 3px;
        margin-top: -4px;
        background: var(--surface);
        box-shadow:
          inset -1.5px -1.5px 2px var(--shadow-dark),
          inset 1.5px 1.5px 2px var(--shadow-light);
      }
    </style>
  </head>
  <body>
    <button
      class="osc-button"
      type="button"
      aria-pressed="false"
      aria-label="Oscillator 1"
    >
      <span class="led" aria-hidden="true"></span>

      <span class="wave-wrap">
        <svg class="wave" viewBox="0 0 130 80" aria-hidden="true">
          <path
            class="line"
            d="M5,55 C25,15 40,15 65,40 C90,65 105,65 125,25"
          />
        </svg>
      </span>

      <span class="label">OSC 1</span>
      <span class="underline"></span>
    </button>

    <script>
      const btn = document.querySelector('.osc-button');
      btn.addEventListener('click', () => {
        const pressed = btn.getAttribute('aria-pressed') === 'true';
        btn.setAttribute('aria-pressed', String(!pressed));
        btn.classList.toggle('is-active', !pressed);
      });
    </script>
  </body>
</html>
